name: Translation fix
description: Wording in one of the languages that is wrong, awkward or missing.
title: "[i18n]: "
labels: ["translation"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Italian
        - English
        - A language not yet supported
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where the text appears
      description: The page, and what you were doing when you saw it.
      placeholder: Coach panel, after a wrong move in the French Defence drill
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current wording
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed wording
    validations:
      required: true
